$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "{{correo}}",
      "contrasena": "secreta123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.collectionVariables.set('token', pm.response.json().token);
      }
    language: text/javascript
order: 6000
