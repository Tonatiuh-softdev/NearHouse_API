$kind: http-request
description: Crea la cuenta. Usa el comprobanteCorreo que guardó el paso 2. El tokenFirebase todavía no se revisa de verdad (falta el paso 6).
url: "{{baseUrl}}/api/v1/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "{{correo}}",
      "contrasena": "secreta123",
      "nombre": "Ana",
      "primerApellido": "López",
      "segundoApellido": "García",
      "telefono": "{{telefono}}",
      "comprobanteCorreo": "{{comprobanteCorreo}}",
      "tokenFirebase": "token-de-prueba"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          pm.collectionVariables.set('token', pm.response.json().token);
      }
    language: text/javascript
order: 5000
